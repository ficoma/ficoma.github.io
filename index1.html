<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reloj y Clima</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: white;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 30px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .clock {
      font-size: 4rem;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    .date {
      font-size: 1.2rem;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .weather {
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
    }

    .weather h2 {
      margin-bottom: 15px;
      color: #facc15;
    }

    .temp {
      font-size: 3rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .description {
      font-size: 1.2rem;
      text-transform: capitalize;
      margin-bottom: 10px;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .loading {
      opacity: 0.7;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .clock {
        font-size: 2.8rem;
      }

      .temp {
        font-size: 2.2rem;
      }
    }
  </style></head>
<body>  <div class="container">
    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="date">Cargando fecha...</div><div class="weather">
  <h2>☁️ Información del clima</h2>
  <div id="weatherContent" class="loading">
    Obteniendo datos del clima...
  </div>
</div>

  </div>  <script>
    // =========================
    // RELOJ DIGITAL
    // =========================

    function updateClock() {
      const now = new Date();

      const time = now.toLocaleTimeString('es-MX', {
        hour12: false
      });

      const date = now.toLocaleDateString('es-MX', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('clock').textContent = time;
      document.getElementById('date').textContent = date;
    }

    setInterval(updateClock, 1000);
    updateClock();


    // =========================
    // CLIMA
    // =========================

    // Reemplaza TU_API_KEY con tu clave de OpenWeatherMap
    const API_KEY = '2b890704522e73608e585222052e2711';

    async function getWeather(lat, lon) {
      try {
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=es&appid=${API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById('weatherContent').innerHTML = `
          <div>
            <h3>${data.name}</h3>
            <div class="temp">${Math.round(data.main.temp)}°C</div>
            <div class="description">${data.weather[0].description}</div>

            <div class="details">
              <div>💧 ${data.main.humidity}%</div>
              <div>🌬️ ${data.wind.speed} m/s</div>
            </div>
          </div>
        `;

      } catch (error) {
        document.getElementById('weatherContent').innerHTML = `
          <p>No se pudo obtener el clima.</p>
        `;

        console.error(error);
      }
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            getWeather(lat, lon);
          },
          () => {
            document.getElementById('weatherContent').innerHTML = `
              <p>Permiso de ubicación denegado.</p>
            `;
          }
        );
      } else {
        document.getElementById('weatherContent').innerHTML = `
          <p>Tu navegador no soporta geolocalización.</p>
        `;
      }
    }

    getLocation();
  </script></body>
</html>
